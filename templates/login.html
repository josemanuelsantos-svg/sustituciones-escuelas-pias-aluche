<!DOCTYPE html>
<html lang="es" class="h-full bg-[#070f22]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1936">
  <title>Acceso · Sustituciones Escuelas Pías Aluche</title>
  
  <!-- Favicon Oficial Escuelas Pías -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/escudo_escolapios_180.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/escudo_escolapios_180.png') }}">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: #070f22;
      background-image: radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.15) 0px, transparent 50%);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-card {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-full flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white">

  <div class="max-w-md w-full bg-[#0b1936]/90 backdrop-blur-md rounded-3xl p-8 sm:p-10 shadow-2xl border border-blue-900/60 animate-card space-y-6 text-white">
    
    <!-- Logo y Cabecera del Centro -->
    <div class="text-center space-y-3">
      <div class="flex justify-center">
        <img src="{{ url_for('static', filename='img/logo_escuelas_pias_blanco.png') }}" alt="Colegio Nuestra Señora de las Escuelas Pías Aluche" class="h-14 sm:h-16 w-auto object-contain">
      </div>
      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-400/30 text-[11px] font-black uppercase tracking-wider mb-1">
          Acceso Restringido
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">Portal de Sustituciones</h1>
        <p class="text-xs text-blue-200/70 mt-0.5">Coordinación de Infantil y Primaria · Vero</p>
      </div>
    </div>

    <!-- Mensaje de Error (si existe) -->
    {% if error %}
    <div class="p-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/40 text-rose-200 text-xs font-bold flex items-center gap-2.5">
      <i class="ph-bold ph-warning-circle text-lg text-rose-400 shrink-0"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Formulario de Acceso -->
    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label for="clave" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Clave de Acceso</label>
        <div class="relative">
          <input 
            type="password" 
            id="clave" 
            name="clave" 
            autofocus 
            required
            autocomplete="current-password"
            placeholder="Introduce la clave de acceso..." 
            class="w-full px-4 py-3.5 pr-11 rounded-2xl bg-slate-900/80 border border-blue-800/80 text-white placeholder-slate-500 font-semibold text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition">
          <button 
            type="button" 
            onclick="togglePassword()" 
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition"
            title="Mostrar / ocultar clave">
            <i id="eye-icon" class="ph-bold ph-eye text-lg"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-400">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" name="recordar" checked class="w-4 h-4 rounded text-blue-600 bg-slate-900 border-slate-700 focus:ring-blue-500 focus:ring-offset-slate-900">
          <span>Recordar en este dispositivo</span>
        </label>
      </div>

      <button 
        type="submit" 
        class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-sm rounded-2xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center gap-2 group">
        <span>Entrar al Sistema</span>
        <i class="ph-bold ph-arrow-right text-base group-hover:translate-x-0.5 transition-transform"></i>
      </button>
    </form>

    <!-- Pie de página informativo -->
    <div class="pt-2 border-t border-slate-800/80 text-center">
      <p class="text-[11px] text-slate-400">
        Colegio Ntra. Sra. de las Escuelas Pías · Aluche (Madrid)
      </p>
    </div>

  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById("clave");
      const icon = document.getElementById("eye-icon");
      if (input.type === "password") {
        input.type = "text";
        icon.className = "ph-bold ph-eye-slash text-lg";
      } else {
        input.type = "password";
        icon.className = "ph-bold ph-eye text-lg";
      }
    }
  </script>

</body>
</html>
